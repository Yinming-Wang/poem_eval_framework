# 模型配置说明：
# 1. 当前默认使用本地 Hugging Face 模型 Qwen2.5-0.5B-Instruct。
# 2. 如果只想先跑通流程，可把 model_type 改为 "mock"。
# 3. Windows 路径建议使用正斜杠，避免反斜杠转义问题。

# WebUI 多模型评测：以下列表填写 models/ 下的子目录名（与扫描到的目录一致）。
# 非空则 WebUI 进入多模型模式，可勾选同时进行单条评测与批量评测；列表有几项就代表最多可同时测几个（也可少选）。
# 留空或整段删掉则仍为单模型模式：仍用下拉框从 models/ 中任选一个目录。
eval_models:
  - "LSTM"
  - "GPT2-full-finetune"
  - "Qwen3-0.6-full-finetune"
  - "GLM-9B-lora-finetune"
  - "Qwen2.5-0.5B-Instruct"

# 可选：限制 WebUI 勾选数量上限（不填则至多可选 eval_models 中全部项）。
# webui_max_parallel_models: 2

model:
  model_name: "LSTM"
  model_type: "huggingface"
  model_path: "MODEL_PATH"
  tokenizer_path: "TOKENIZER_PATH"
  device: "cuda:0"

generation:
  max_new_tokens: 128
  temperature: 0.8
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.1
  do_sample: true

prompt:
  template: "请围绕主题“{theme}”创作一首{poem_type}。\n要求：只输出诗词正文，不要标题、解释、赏析、序号或任何说明文字。\n格式要求：五言绝句为四句、每句五个汉字；七言绝句为四句、每句七个汉字。"

# LLM-as-a-Judge 判分模型配置。
# 这里填写兼容 OpenAI Chat Completions 格式的 API，例如 DeepSeek。
# evaluation/run_style_eval.py 会默认读取这里的配置；命令行参数可临时覆盖。
judge:
  api_url: "https://api.deepseek.com/chat/completions"
  api_key: "API_KEY"
  model_name: "deepseek-chat"
  require_api: true
